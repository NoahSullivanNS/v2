<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twatter Feed</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a73e8;
            text-align: center;
            margin-top: 2rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        h3 {
            font-size: 1.5rem;
            color: #222;
            font-weight: bold;
        }

        p {
            font-size: 1rem;
            color: #555;
            line-height: 1.6;
        }

        small {
            font-size: 0.9rem;
            color: #888;
        }

        /* Button Styles */
        button {
            background-color: #1a73e8;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.3s;
            margin-bottom: 2rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button:hover {
            background-color: #1558c3;
            transform: translateY(-2px);
        }

        button:focus {
            outline: none;
        }

        /* Card Style for Each Joke */
        .joke-card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin: 1.5rem 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .joke-card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .joke-headline {
            font-weight: bold;
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .joke-description {
            font-style: italic;
            color: #666;
            margin-bottom: 1rem;
        }

        .joke-footer {
            font-size: 0.9rem;
            color: #888;
        }

        .divider {
            border-bottom: 2px solid #f1f1f1;
            margin: 1.5rem 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .joke-card {
                padding: 15px;
                margin: 1rem;
            }

            button {
                width: 80%;
                padding: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
    <script>
        function runFetch() {
            fetch('/run-fetch/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    location.reload();  // Optionally reload to show new jokes
                } else {
                    alert("Failed to fetch jokes.");
                }
            });
        }

        function getCSRFToken() {
            return document.cookie.split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
        }
    </script>
</head>
<body>

    <h1>Twatter Joke Feed</h1>

    <!-- Button to Fetch New Jokes -->
    <button onclick="runFetch()">Fetch New Jokes</button>

    <div class="divider"></div>

    <!-- Joke Cards List -->
    <div id="joke-list">
        {% for joke in jokes %}
        <div class="joke-card">
            <div class="joke-headline">{{ joke.headline }}</div>
            <div class="joke-description">{{ joke.joke }}</div>
            <div class="joke-footer">
                <small>Source: {{ joke.source }} | Published: {{ joke.published_at }}</small>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>

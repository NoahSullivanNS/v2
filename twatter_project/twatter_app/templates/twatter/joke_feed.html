<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twatter Feed</title>
    <meta name="csrf-token" content="{{ csrf_token }}">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a73e8;
            text-align: center;
            margin: 2rem 0 1.5rem;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.15);
        }

        button {
            background-color: #1a73e8;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.3s;
            display: block;
            margin: 0 auto 2rem;
        }

        button:hover {
            background-color: #125fcc;
            transform: translateY(-2px);
        }

        button:focus {
            outline: none;
        }

        .divider {
            border-bottom: 2px solid #e0e0e0;
            margin: 0 1rem 2rem;
        }

        .joke-card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 24px;
            margin: 1.5rem auto;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
            max-width: 800px;
            transition: box-shadow 0.3s;
        }

        .joke-card:hover {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        .joke-headline {
            font-size: 1.4rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 0.5rem;
        }

        .joke-description {
            font-style: italic;
            color: #555;
            margin-bottom: 1rem;
        }

        .joke-footer {
            font-size: 0.9rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 0.5rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .joke-card {
                padding: 16px;
                margin: 1rem;
            }

            button {
                width: 90%;
                font-size: 0.95rem;
            }
        }
    </style>

    <script>
        function runFetch() {
            fetch('/run-fetch/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    location.reload();
                } else {
                    alert("Failed to fetch jokes.");
                }
            });
        }

        function getCSRFToken() {
            return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        }
    </script>
</head>

<body>

    <h1>🃏 Twatter Joke Feed</h1>

    <button onclick="runFetch()">📥 Fetch New Jokes</button>

    <div class="divider"></div>

    <div id="joke-list">
        {% for joke in jokes %}
        <div class="joke-card">
            <div class="joke-headline">📰 {{ joke.headline }}</div>
            <div class="joke-description">"{{ joke.joke }}"</div>
            <div class="joke-footer">
                Source: {{ joke.source }} &nbsp;|&nbsp; Published: {{ joke.published_at }}
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
